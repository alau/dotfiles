worktree-path = "{{ repo_path }}/../{{ branch | sanitize }}"

# Blocking: copy .env and other gitignored files from the source worktree first,
# so the dep installers below see any env vars they need.
pre-start = "wt step copy-ignored"

# Background: dep installs run concurrently after the worktree is ready.
[post-start]
uv = "command -v uv >/dev/null && [ -f pyproject.toml ] && uv sync --all-extras || true"
go = "command -v go >/dev/null && [ -f go.mod ] && go mod download || true"

[step.copy-ignored]
exclude = [".venv/"]
